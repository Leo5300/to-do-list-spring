
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To Do List</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1>Lista de tarefas</h1>

    <table class="table" th:unless="${#lists.isEmpty(todos)}">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Título:</th>
          <th scope="col">Criado em:</th>
          <th scope="col">Data de entrega:</th>
          <th scope="col">Finalizado em:</th>
          <th scope="col">Ações</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="todo : ${todos}">
          <th scope="row" th:text="${todo.id}">---</th>

          <td th:text="${todo.title}">---</td>

          <td th:text="${#temporals.format(todo.createdAt, 'dd/MM/yyyy HH:mm')}">
            ---
          </td>

          <td th:text="${#temporals.format(todo.deadline, 'dd/MM/yyyy')}">
            ---
          </td>

          <td th:text="${todo.finishedAt != null ? #temporals.format(todo.finishedAt, 'dd/MM/yyyy') : '-'}">
            ---
          </td>

          <td>
            <a href="" class="btn btn-sm btn-primary">Concluir</a>
            <a href="" class="btn btn-sm btn-secondary">Editar</a>
            <a href="" class="btn btn-sm btn-danger">Excluir</a>
          </td>
        </tr>
      </tbody>
    </table>
    <p th:if="${#lists.isEmpty(todos)}"> Nenhuma tarefa cadastrada.</p>
    <a th:href="@{todo/create}" class="btn btn-sm btn-primary">Nova Tarefa</a>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
